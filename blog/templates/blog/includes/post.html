{% load static %}
<li>
    <article class="post">
        {% if post.title %}
            <a href="{% url 'post-detail-page' post.slug %}">
        {% else %}
            <a href="#">
        {% endif %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}">
            <div class="post__content">
                <h3>{{ post.title }}</h3>
                <p>{{ post.excerpt }}</p>
            </div>
        </a>
    </article>
</li>
